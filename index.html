<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أرشيف الأشرطة – إدارة الأعمال والتقارير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style id="pageStyle">@page{size:A4 portrait;margin:12mm 10mm 20mm}</style>
</head>
<body>

<!-- ========== تسجيل الدخول ========== -->
<section id="loginView" class="login-wrap" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="logo">▣</div>
    <h1>أرشيف الأشرطة</h1>
    <p class="muted">سجّل الدخول للوصول إلى قاعدة البيانات</p>
    <div id="demoNote" class="demo-note" hidden></div>
    <label>البريد الإلكتروني
      <input type="email" id="loginEmail" required autocomplete="username" dir="ltr">
    </label>
    <label>كلمة المرور
      <input type="password" id="loginPass" required autocomplete="current-password" dir="ltr">
    </label>
    <div id="loginErr" class="err" role="alert"></div>
    <button class="btn primary block" type="submit">دخول</button>
  </form>
</section>

<!-- ========== التطبيق ========== -->
<div id="appView" hidden>
  <header class="app-header no-print">
    <div class="brand"><span class="logo sm">▣</span><b>أرشيف الأشرطة</b><span id="modeBadge" class="badge demo" hidden>وضع تجريبي</span></div>
    <nav id="nav" class="nav"></nav>
    <div class="userbox">
      <span id="userName"></span>
      <span id="userRole" class="badge"></span>
      <button class="btn ghost sm" id="logoutBtn">خروج</button>
    </div>
  </header>

  <main id="view" class="view"></main>
</div>

<!-- يظهر في كل صفحة (شاشة + طباعة + PDF) -->
<footer class="site-footer">
  <span class="owner">تصميم <b>محمود عادل</b></span>
  <span class="dot owner">•</span>
  <span>أرشيف الأشرطة © <span id="yr"></span></span>
</footer>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/logo.js"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
